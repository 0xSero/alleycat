[workspace]
members = [
    "crates/acp-bridge",
    "crates/alleycat",
    "crates/amp-bridge",
    "crates/bridge-conformance",
    "crates/bridge-core",
    "crates/claude-bridge",
    "crates/claude-remote-control",
    "crates/codex-proto",
    "crates/devin-bridge",
    "crates/grok-bridge",
    "crates/droid-bridge",
    "crates/hermes-bridge",
    "crates/pi-bridge",
    "crates/opencode-bridge",
    "crates/shell-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"
authors = ["The Alleycat Authors"]
repository = "https://github.com/dnakov/alleycat"
homepage = "https://github.com/dnakov/alleycat"
readme = "README.md"

[workspace.dependencies]
alleycat-acp-bridge = { path = "crates/acp-bridge", version = "0.1" }
alleycat-bridge-core = { path = "crates/bridge-core", version = "0.1" }
alleycat-amp-bridge = { path = "crates/amp-bridge", version = "0.1" }
alleycat-codex-proto = { path = "crates/codex-proto", version = "0.1" }
alleycat-claude-bridge = { path = "crates/claude-bridge", version = "0.1" }
alleycat-devin-bridge = { path = "crates/devin-bridge", version = "0.1" }
alleycat-grok-bridge = { path = "crates/grok-bridge", version = "0.1" }
alleycat-droid-bridge = { path = "crates/droid-bridge", version = "0.1" }
alleycat-hermes-bridge = { path = "crates/hermes-bridge", version = "0.1" }
alleycat-opencode-bridge = { path = "crates/opencode-bridge", version = "0.1" }
alleycat-pi-bridge = { path = "crates/pi-bridge", version = "0.1" }
alleycat-shell-bridge = { path = "crates/shell-bridge", version = "0.1" }
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
fd-lock = "4"
futures = "0.3"
hex = "0.4"
hostname = "0.4"
iroh = "0.98.1"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
which = "6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
uuid = { version = "1", features = ["serde", "v7"] }
pretty_assertions = "1"
tempfile = "3"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
